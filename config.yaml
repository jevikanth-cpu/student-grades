seed: 42
uci_id: 320
target: G3
# Early-warning tool: predict WITHOUT G1/G2 (earlier period grades).
# Set to true to build a "late" tool that also uses them.
use_previous_grades: false
test_size: 0.2
cv:
  n_splits: 5
  n_repeats: 2
scoring: neg_root_mean_squared_error
model_path: models/model.joblib
grids:
  ridge:
    model__alpha: [1.0, 10.0, 100.0, 300.0, 1000.0]
  lasso:
    model__alpha: [0.01, 0.05, 0.1, 0.5]
  knn:
    model__n_neighbors: [5, 10, 20, 40]
    model__weights: [uniform, distance]
  huber:
    model__epsilon: [1.35, 2.0]
    model__alpha: [1.0, 10.0, 100.0]
