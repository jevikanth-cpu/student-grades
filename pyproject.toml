[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-grades"
version = "0.1.0"
description = "Predict the final grade (G3) of a student from UCI Student Performance."
requires-python = ">=3.10"
# Pin to the versions you actually run: check with `pip freeze | grep -i -E "pandas|scikit|numpy|joblib|yaml|ucimlrepo|pytest|ruff"`
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "ucimlrepo>=0.0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
